name: Feature request
description: Suggest a new fetcher, pipeline step, or other improvement.
title: "[feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: What's missing or awkward today, and why it matters.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What you'd like to see happen, as concretely as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't prefer them.
    validations:
      required: false

  - type: dropdown
    id: pr
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - "Yes"
        - "Yes, with some guidance"
        - "No, just suggesting"
    validations:
      required: true

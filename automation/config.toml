# Job watcher configuration.
# Secrets do NOT belong here — put them in automation/.env
# Source list lives in automation/sources.toml

[poll]
interval_minutes = 30
# Postings older than this are ignored outright.
max_age_days = 14
# Per-source HTTP timeout, seconds.
timeout_seconds = 30
# How many consecutive failures a source is allowed before it switches itself
# off and sends exactly one notification instead of retry-spamming.
#
# Two tiers, because the two kinds of source fail differently. A stable source
# is a documented JSON API or an ATS board: when it fails three times running,
# something is genuinely wrong. A `fragile = true` source is browser-driven
# scraping against anti-bot pages whose markup changes without notice, where an
# isolated failure is ordinary weather — holding it to the same three strikes is
# how a working scraper switches itself off over one bad afternoon.
failures_before_disable = 3
fragile_failures_before_disable = 6
# A disabled source does not stay off for good. After this cooldown it gets one
# quiet retry; a retry that works re-enables it and sends a recovery ping, a
# retry that fails restarts the clock in silence.
# 0 = never auto-retry (manual `watcher.health --reset` only).
retry_after_minutes = 60
# Each failed retry multiplies the cooldown, capped. With these values a source
# is probed after 1h, 2h, 4h, 8h, 16h, then daily — so a source that recovers
# quickly is still caught within the hour, while one that has been dead for a
# week stops spending 24 pointless requests a day to confirm it.
# factor = 1.0 restores the old flat cooldown.
retry_backoff_factor = 2.0
retry_backoff_max_minutes = 1440

[match]
model = "haiku"
batch_size = 8
# score >= notify_threshold  -> instant Telegram ping
# score >= digest_threshold  -> daily digest line
# below that                 -> stored silently, visible via `--replay`
#
# Calibrated with `python -m watcher.match --calibrate`: postings already
# applied to in 2026/ cluster between 60 and 82, while clear misfits (a support
# role, a US-based posting) sit at 40 or below. So the honest floor for "worth
# interrupting someone about" is somewhere in the 60s, and everything from 40 up
# is worth seeing eventually.
#
# The cut sits in the 60s, deliberately above the bottom of that cluster rather
# than at it: the slice just below it is real but not urgent, and it reaches the
# evening digest intact rather than being lost — which was not true while the
# digest was silently failing on its own length. Lower it to trade quiet for
# immediacy.
#
# `/threshold` moves it from chat and rewrites only the line below, never this
# paragraph — so the number in force is the one on that line, not one quoted
# here. Naming it in the prose only guarantees the prose goes stale.
notify_threshold = 65
digest_threshold = 40
# How much of the job description is handed to the matcher.
description_chars = 4000
timeout_seconds = 180
# A posting the scorer cannot judge is held back and retried on later cycles
# rather than stored at the fallback score, which sits below notify_threshold
# and would bury it silently. Only after this many failures is the fallback
# treated as the real verdict — by then it is the posting, not the weather.
max_score_attempts = 3

[notify]
# 24h local time
digest_hour = 19
heartbeat_hour = 9
# Snooze duration for a "later" reply.
snooze_days = 7

[notify.topics]
# Forum topic ids, if TELEGRAM_CHAT_ID points at a group with topics turned on.
# Leave them all at 0 (or delete the section) and every message goes to the chat
# exactly as it always has — this is purely additive.
#
# To find the ids: run `python -m watcher.whoami` and post a message in each
# topic you want to use — it prints a thread id for every topic it hears from.
# Any topic you leave at 0 falls back to General.
#
#   new_posting      instant pings and the evening digest
#   targeted_build   a posting you replied "yes" to, filed as a record of the
#                    decision — this one sends nothing at all until it is set
#   processing_build queued, building, retrying, or declined as a duplicate
#   failed_build     a build that failed, and any retraction of a ready message
#   completed_build  the application is ready, and the run is complete
#
# Everything else — the heartbeat, source alerts, the weekly rules proposal, the
# interrupted-build notice — stays in General, beside /status and /restart, which
# are only answered from there.
new_posting = 159
targeted_build = 162
processing_build = 172
failed_build = 165
completed_build = 168

[build]
# While false, an approval reply is recorded but no headless build is spawned.
# Builds run with bypassPermissions, guarded by build_settings.json and
# hooks/guard.py; set this back to false to stop them at the source.
enabled = true
claude_bin = "claude"
# Orchestrator model for a headless build. Sonnet per CLAUDE.md — subagents
# pin their own models, so the two writing steps still run on Opus.
model = "sonnet"
timeout_minutes = 45
# Extra attempts after a build dies on a *transient upstream* failure — a 503, a
# rate limit, a dropped connection. Nothing else is retried: a timeout, a crash,
# or a build that wrote the wrong files would fail the same way again.
#
# 0 disables it: one attempt, and a transient failure is reported like any other.
# Currently off. The case for 1 was that an outage landing on the last turn of a
# 25-minute run costs an application that was all but finished — but the two
# guards added since take most of that risk away on their own. A run whose CV and
# cover letter are already on disk is salvaged rather than retried, and a run that
# died earlier than that is a second half-hour spent on a gateway that is usually
# still unwell. Put it back to 1 if failed builds start clustering on 503s.
retries = 0
retry_delay_seconds = 120
# The "🛠 Building …" message is edited in place for the length of the run,
# showing each pipeline step and what it cost. Turn it off and that message is
# sent once and left alone, exactly as it behaved before.
#
# The refresh is what keeps the *running* step's clock moving; a step starting or
# finishing redraws straight away regardless. So the interval is not how quickly
# progress shows up, only how live one number looks — which is why it is set in
# tens of seconds rather than ones. The floor exists for the parallel phases,
# where three or four steps land within a second of each other and would
# otherwise be three or four separate edits.
progress_updates = true
progress_refresh_seconds = 30
progress_min_interval_seconds = 5
# Role-title similarity at or above this counts as "already applied".
duplicate_title_ratio = 0.8
# Only look this far back when deciding whether a role is a duplicate.
duplicate_lookback_days = 365

[kb]
# The weekly pass that reads recent replies and proposes condensed Prefer/Avoid
# rules for profile_kb.md. It never writes the file on its own: the proposal
# goes to Telegram and is applied only on an explicit "yes".
enabled = true
model = "sonnet"
# 0 = Monday … 6 = Sunday, and the hour in 24h local time.
weekday = 6
hour = 18
# Fewer new decisions than this since the last proposal and the run is skipped.
min_decisions = 5
# How many decisions.jsonl entries the proposal may look at.
lookback = 60
timeout_seconds = 180

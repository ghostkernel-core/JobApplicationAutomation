[pytest]
testpaths = tests
# Live tests hit the real Jobsuche API and are opt-in: `pytest -m live`.
# Everything else must run offline and deterministically.
addopts = -m "not live" --strict-markers
markers =
    live: hits a third-party API over the network (deselected by default)
    live_browser: a `live` check that also needs a real browser and is subject
        to bot management, so a datacenter IP can fail it for reasons that say
        nothing about the source

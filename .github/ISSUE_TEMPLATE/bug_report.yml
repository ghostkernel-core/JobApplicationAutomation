name: Bug report
description: Something in the watcher, pipeline, or rendering isn't working as expected.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Before you submit, please double-check the
        redaction checkbox below — this repo is public, and issues are too.

  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction check
      description: >-
        Please confirm you have removed personal data and secrets from everything you are about
        to paste, including log excerpts and file paths.
      options:
        - label: >-
            I have redacted any real name, email, phone number, address, Telegram bot token,
            API key, or personal file path from this report.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: dropdown
    id: part
    attributes:
      label: Which part of the project
      options:
        - watcher
        - pipeline & agents
        - LaTeX rendering
        - setup & init
        - docs
        - other / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.4 (python --version)
    validations:
      required: true

  - type: input
    id: latex-engine
    attributes:
      label: LaTeX engine
      description: Only relevant for rendering bugs. Leave blank otherwise.
      placeholder: e.g. latexmk + xelatex (MiKTeX 24), or "not applicable"
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Relevant log excerpt
      description: >-
        Paste the smallest relevant excerpt, already redacted per the checkbox above. Use a code
        block. Do not paste full guard.log or full build NDJSON logs.
      render: text
    validations:
      required: false
